name: probe-schedule

# 临时诊断: 验证本仓库的 schedule 事件能否被注册并投递。
# 全新文件 = 全新的 workflow id / schedule 注册, 与 bot.yml 互不影响。
# 不读 Secret、不 checkout、不写 state.json、不发帖; 验证完立即删除。
on:
  schedule:
    # 官方允许的最短间隔 5 分钟, 便于 15~20 分钟内拿到多个观测点; 默认 UTC。
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Print trigger info
        run: |
          echo "event=${{ github.event_name }}"
          echo "schedule=${{ github.event.schedule }}"
          echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "beijing=$(TZ=Asia/Shanghai date +%Y-%m-%dT%H:%M:%S%z)"
