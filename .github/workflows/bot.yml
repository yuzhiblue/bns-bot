name: bns-bot
run-name: "cycle · ${{ inputs.source || github.event_name }}"

# 公开仓库的标准 runner 免费且不限分钟数, 不消耗私有库每月 2000 分钟额度。
on:
  schedule:
    # 仅作兜底: GitHub schedule 是 best-effort, 实测会连续数小时漏跑。
    # 主触发来自外部定时器 POST workflow_dispatch(见 README「外部定时器」一节)。
    # UTC 时间, 每 15 分钟一轮; 整点最容易排队, 故意错开 8 分钟。
    - cron: "8 * * * *"
    - cron: "23 * * * *"
    - cron: "38 * * * *"
    - cron: "53 * * * *"
  workflow_dispatch:
    inputs:
      test_post:
        description: "勾选后只发一条测试帖验证发帖接口(不跑常规轮次)"
        type: boolean
        default: false
      test_image:
        description: "勾选后生成行情卡片图并带图发一条测试帖, 验证图片上传与发布链路"
        type: boolean
        default: false
      source:
        description: "触发来源标记, 仅用于日志辨识; 外部定时器可填 cron-job.org 等"
        type: string
        default: "manual"

# 需要把 state.json 推回仓库
permissions:
  contents: write

# 同一时刻只允许一个实例写状态文件, 避免并发覆盖
concurrency:
  group: bns-bot-state
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install deps (canvas) and font
        # @napi-rs/canvas 用于本地生成行情卡片 PNG; 字体确保卡片文字可渲染。
        run: |
          sudo apt-get update -y >/dev/null 2>&1 || true
          sudo apt-get install -y fonts-dejavu-core >/dev/null 2>&1 || true
          npm install

      # 仓库 config.json(已 checkout, 不含 Key) + Secret 里的 Key 注入 openApiKey
      - name: Inject OpenAPI key into config
        env:
          BNS_CONFIG: ${{ secrets.BNS_CONFIG }}
        run: |
          if [ -z "$BNS_CONFIG" ]; then
            echo "::error::仓库 Secret BNS_CONFIG 未设置(现在只存 OpenAPI Key 字符串)"
            exit 1
          fi
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('config.json','utf8'));c.openApiKey=process.env.BNS_CONFIG;fs.writeFileSync('config.json',JSON.stringify(c,null,2));if(!c.openApiKey)throw new Error('openApiKey 注入失败');console.log('config.json 就绪, dryRun=' + c.dryRun)"

      - name: Trigger info
        run: echo "触发来源=${{ inputs.source || github.event_name }} event=${{ github.event_name }} ref=${{ github.ref_name }}"

      - name: Run one cycle
        if: ${{ inputs.test_post != true }}
        run: node bot.js --once

      - name: Test image post
        if: ${{ inputs.test_image == true }}
        run: node bot.js --test-image

      - name: Test publish endpoint
        if: ${{ inputs.test_post == true && inputs.test_image != true }}
        run: node bot.js --test

      - name: Persist state.json
        run: |
          git config user.name "bns-bot[bot]"
          git config user.email "bns-bot[bot]@users.noreply.github.com"
          git add -f state.json
          if git diff --cached --quiet; then
            echo "state.json 无变化, 跳过提交"
            exit 0
          fi
          git commit -m "chore: persist bot state $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          branch="${GITHUB_REF_NAME}"
          git pull --rebase origin "${branch}" || true
          n=0
          until git push origin "HEAD:${branch}"; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then
              echo "::error::state.json 推送失败"
              exit 1
            fi
            git pull --rebase origin "${branch}" || git rebase --abort || true
            sleep 2
          done
